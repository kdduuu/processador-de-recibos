[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "automacao-kit-fechamento-rh"
version = "1.1.1"
description = "Automação interna para organização e validação dos recibos do RH."
requires-python = ">=3.13"

dependencies = [
    "PyMuPDF==1.28.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]